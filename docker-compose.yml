services:
  frontend:
    build:
      context: /opt/aula/frontend
      args:
        VITE_API_BASE_URL: https://aula.smondevstudio.com/api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    networks:
      - aula-net
      - proxy-net

  backend:
    build:
      context: /opt/aula/backend
    restart: unless-stopped
    env_file:
      - /opt/aula/deploy/.env
    depends_on:
      - postgres
    networks:
      - aula-net
      - proxy-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: aula
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aula-net

volumes:
  postgres_data:

networks:
  aula-net:
    driver: bridge
  proxy-net:
    external: true
